<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" width="512" height="512"
     role="img" aria-label="TripTime logo: a gauge with a needle leaning right of centre">
  <title>TripTime</title>
  <!--
    A faithful trace of app/src/main/res/drawable/ic_launcher_foreground.xml over the white
    background layer, cropped to the r=36 circle an adaptive-icon launcher mask actually shows.
    Geometry is unchanged from the shipped icon — see that file's comment for why each number
    is what it is. Regenerate docs/logo.png from this if the icon ever changes.
  -->
  <circle cx="54" cy="54" r="36" fill="#FFFFFF"/>
  <g fill="none" stroke="#000000" stroke-linecap="round">
    <path d="M28,65 A26,26 0 0,1 80,65" stroke-width="6"/>
    <path d="M41,52 L38,49" stroke-width="4"/>
    <path d="M67,52 L70,49" stroke-width="4"/>
    <path d="M54,65 L60,48" stroke-width="6"/>
  </g>
  <circle cx="54" cy="65" r="5" fill="#000000"/>
</svg>
